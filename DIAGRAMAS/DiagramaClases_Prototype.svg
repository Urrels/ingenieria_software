<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1223px;height:718px;background:#FFFFFF;" width="1223px" height="718px" viewBox="0 0 1223 718" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="441.614" y="22.995" fill="#000" font-size="14" textLength="333.272" font-weight="700">Patrón Prototype — Duplicar rol (BE / BLL)</text></g><!--cluster BE--><g class="cluster" data-qualified-name="BE" id="ent0001" data-source-line="9"><rect x="335.5" y="199.297" width="448" height="375" fill="#FEFECE" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="549.383" y="214.292" fill="#000" font-size="14" textLength="20.234" font-weight="700">BE</text></g><!--cluster BLL--><g class="cluster" data-qualified-name="BLL" id="ent0008" data-source-line="37"><rect x="799.5" y="203.297" width="408" height="156" fill="#FFE6CC" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="989.244" y="218.292" fill="#000" font-size="14" textLength="28.513" font-weight="700">BLL</text></g><!--cluster CAPAS--><g class="cluster" data-qualified-name="CAPAS" id="ent0010" data-source-line="45"><rect x="894.5" y="49.297" width="218" height="115" fill="#F8CECC" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="977.356" y="64.292" fill="#000" font-size="14" textLength="52.288" font-weight="700">CAPAS</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="55"><path d="M6,259.297 L6,329.828 A0,0 0 0 0 6,329.828 L245.315,329.828 L483.134,423.566 L253.315,329.828 L319.043,329.828 A0,0 0 0 0 319.043,329.828 L319.043,269.297 L309.043,259.297 L6,259.297 A0,0 0 0 0 6,259.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M309.043,259.297 L309.043,269.297 L319.043,269.297 L309.043,259.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="276.364" fill="#000" font-size="13" textLength="72.827" font-weight="700">Prototype</text><text x="84.827" y="276.364" fill="#000" font-size="13" textLength="56.799">: declara</text><text x="145.758" y="276.364" fill="#000" font-size="13" textLength="62.613" font-family="monospace">Clonar()</text><text x="208.371" y="276.364" fill="#000" font-size="13" textLength="32.754">, que</text><text x="12" y="291.497" fill="#000" font-size="13" textLength="290.837">permite crear un objeto nuevo copiando uno</text><text x="12" y="306.629" fill="#000" font-size="13" textLength="292.043">existente sin depender de su clase concreta.</text><text x="12" y="321.762" fill="#000" font-size="13" textLength="233.81">Se suma al Composite ya existente.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="62"><path d="M448,601.297 L448,702.094 A0,0 0 0 0 448,702.094 L803.35,702.094 A0,0 0 0 0 803.35,702.094 L803.35,611.297 L793.35,601.297 L629.5,601.297 L625.5,558.659 L621.5,601.297 L448,601.297 A0,0 0 0 0 448,601.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M793.35,601.297 L793.35,611.297 L803.35,611.297 L793.35,601.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="454" y="618.364" fill="#000" font-size="13" textLength="138.519" font-weight="700">ConcretePrototype</text><text x="592.519" y="618.364" fill="#000" font-size="13">:</text><text x="454" y="633.497" fill="#000" font-size="13">•</text><text x="465.8" y="633.497" fill="#000" font-size="13" textLength="23.48" font-family="monospace">Rol</text><text x="493.413" y="633.497" fill="#000" font-size="13" textLength="263.015">(rama) crea un rol con los mismos datos</text><text x="462.265" y="648.629" fill="#000" font-size="13" textLength="46.744">y clona</text><text x="513.141" y="648.629" fill="#000" font-size="13" textLength="114.689" font-weight="700">recursivamente</text><text x="631.963" y="648.629" fill="#000" font-size="13" textLength="103.016">cada hijo (copia</text><text x="462.265" y="663.762" fill="#000" font-size="13" textLength="326.085">profunda): modificar la copia no afecta al original.</text><text x="454" y="678.895" fill="#000" font-size="13">•</text><text x="465.8" y="678.895" fill="#000" font-size="13" textLength="54.787" font-family="monospace">Permiso</text><text x="524.719" y="678.895" fill="#000" font-size="13" textLength="250.599">(hoja) devuelve un permiso nuevo con</text><text x="462.265" y="694.028" fill="#000" font-size="13" textLength="59.408">el mismo</text><text x="525.805" y="694.028" fill="#000" font-size="13" textLength="15.653" font-family="monospace">Id</text><text x="545.59" y="694.028" fill="#000" font-size="13">y</text><text x="557.416" y="694.028" fill="#000" font-size="13" textLength="46.96" font-family="monospace">Nombre</text><text x="608.508" y="694.028" fill="#000" font-size="13" textLength="84.075">del catálogo.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="71"><path d="M836.5,415.797 L836.5,546.859 A0,0 0 0 0 836.5,546.859 L1170.478,546.859 A0,0 0 0 0 1170.478,546.859 L1170.478,425.797 L1160.478,415.797 L1007.5,415.797 L1003.5,343.31 L999.5,415.797 L836.5,415.797 A0,0 0 0 0 836.5,415.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1160.478,415.797 L1160.478,425.797 L1170.478,425.797 L1160.478,415.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="842.5" y="432.864" fill="#000" font-size="13" textLength="86.093" font-family="monospace">DuplicarRol</text><text x="928.593" y="432.864" fill="#000" font-size="13">:</text><text x="842.5" y="447.997" fill="#000" font-size="13" textLength="174.275">1. busca el rol en el árbol (</text><text x="1016.775" y="447.997" fill="#000" font-size="13" textLength="93.92" font-family="monospace">ObtenerArbol</text><text x="1110.695" y="447.997" fill="#000" font-size="13" textLength="9.452">);</text><text x="842.5" y="463.129" fill="#000" font-size="13" textLength="12.403">2.</text><text x="859.036" y="463.129" fill="#000" font-size="13" textLength="195.667" font-family="monospace">copia = original.Clonar()</text><text x="1054.702" y="463.129" fill="#000" font-size="13">;</text><text x="842.5" y="478.262" fill="#000" font-size="13" textLength="183.593">3. cambia el nombre y quita</text><text x="1030.226" y="478.262" fill="#000" font-size="13" textLength="70.44" font-family="monospace">Protegido</text><text x="1100.666" y="478.262" fill="#000" font-size="13">;</text><text x="842.5" y="493.395" fill="#000" font-size="13" textLength="297.73">4. inserta el rol bajo el mismo padre y guarda</text><text x="854.897" y="508.528" fill="#000" font-size="13" textLength="300.581">los permisos propios de la copia (los sub-roles</text><text x="854.897" y="523.661" fill="#000" font-size="13" textLength="104">no se duplican);</text><text x="842.5" y="538.793" fill="#000" font-size="13" textLength="66.923">5. registra</text><text x="913.556" y="538.793" fill="#000" font-size="13" textLength="101.747" font-family="monospace">ROL_DUPLICADO</text><text x="1019.435" y="538.793" fill="#000" font-size="13" textLength="93.552">en la bitácora.</text></g><!--class NodoPermiso--><g class="entity" data-qualified-name="BE.NodoPermiso" id="ent0002" data-source-line="11"><rect x="483.5" y="404.297" width="284.439" height="154.047" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="575.125" cy="424.43" rx="11" ry="11" fill="#A9DCDF" style="stroke:#181818;stroke-width:1;"/><path d="M575.235,419.773 L574.079,424.852 L576.407,424.852 L575.235,419.773 Z M573.75,417.539 L576.735,417.539 L580.094,429.93 L577.641,429.93 L576.875,426.867 L573.594,426.867 L572.844,429.93 L570.407,429.93 L573.75,417.539 Z " fill="#000"/><text x="605.445" y="420.436" fill="#000" font-size="12" textLength="73.049" font-style="italic">«Prototype»</text><text x="595.625" y="436.2