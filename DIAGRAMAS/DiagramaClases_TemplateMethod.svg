M459.857,212.797 L459.857,222.797 L469.857,222.797 L459.857,212.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="229.864" fill="#000" font-size="13" textLength="128.781" font-weight="700">Template Method</text><text x="140.781" y="229.864" fill="#000" font-size="13">:</text><text x="149.293" y="229.864" fill="#000" font-size="13" textLength="180.013" font-family="monospace">InicializarFormulario()</text><text x="12" y="244.997" fill="#000" font-size="13" textLength="292.551">define la secuencia fija que antes se copiaba</text><text x="12" y="260.129" fill="#000" font-size="13" textLength="127.48">en cada formulario:</text><text x="12" y="275.262" fill="#000" font-size="13" textLength="12.403">1.</text><text x="28.536" y="275.262" fill="#000" font-size="13" textLength="195.667" font-family="monospace">GuardarDefaults(Controls)</text><text x="12" y="290.395" fill="#000" font-size="13" textLength="12.403">2.</text><text x="28.536" y="290.395" fill="#000" font-size="13" textLength="117.4" font-family="monospace">AjustarClaves()</text><text x="154.2" y="290.395" fill="#000" font-size="13" textLength="46.7">← hook</text><text x="12" y="305.528" fill="#000" font-size="13" textLength="182.92">3. registra la clave del título</text><text x="12" y="320.661" fill="#000" font-size="13" textLength="12.403">4.</text><text x="28.536" y="320.661" fill="#000" font-size="13" textLength="226.973" font-family="monospace">IdiomaManager.Registrar(this)</text><text x="12" y="335.793" fill="#000" font-size="13" textLength="12.403">5.</text><text x="28.536" y="335.793" fill="#000" font-size="13" textLength="140.88" font-family="monospace">ActualizarIdioma()</text><text x="173.548" y="335.793" fill="#000" font-size="13">→</text><text x="188.573" y="335.793" fill="#000" font-size="13" textLength="211.32" font-family="monospace">ActualizarTextosDinamicos()</text><text x="408.157" y="335.793" fill="#000" font-size="13" textLength="46.7">← hook</text><text x="12" y="350.926" fill="#000" font-size="13" textLength="12.403">6.</text><text x="28.536" y="350.926" fill="#000" font-size="13" textLength="281.76" font-family="monospace">IdiomaUIHelper.AgregarSelector(this)</text><text x="12" y="366.059" fill="#000" font-size="13" textLength="57.713">7. skin +</text><text x="73.845" y="366.059" fill="#000" font-size="13" textLength="203.493" font-family="monospace">AppTheme.AplicarTema(this)</text><text x="12" y="381.192" fill="#000" font-size="13" textLength="93.92" font-family="monospace">OnFormClosed</text><text x="110.052" y="381.192" fill="#000" font-size="13" textLength="160.551">desregistra el formulario</text><text x="12" y="396.325" fill="#000" font-size="13" textLength="207.6">del Observer automáticamente.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="67"><path d="M365.5,557.797 L365.5,628.328 A0,0 0 0 0 365.5,628.328 L686.617,628.328 A0,0 0 0 0 686.617,628.328 L686.617,567.797 L676.617,557.797 L557.648,557.797 L582.23,522.009 L549.648,557.797 L365.5,557.797 A0,0 0 0 0 365.5,557.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M676.617,557.797 L676.617,567.797 L686.617,567.797 L676.617,557.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="371.5" y="574.864" fill="#000" font-size="13" textLength="57.707">Redefine</text><text x="433.339" y="574.864" fill="#000" font-size="13" textLength="117.4" font-family="monospace">AjustarClaves()</text><text x="554.871" y="574.864" fill="#000" font-size="13" textLength="71.373">para evitar</text><text x="371.5" y="589.997" fill="#000" font-size="13" textLength="115.819">claves repetidas (</text><text x="487.319" y="589.997" fill="#000" font-size="13" textLength="140.88" font-family="monospace">lblTitulo_Bitacora</text><text x="628.199" y="589.997" fill="#000" font-size="13" textLength="16.897">) y</text><text x="371.5" y="605.129" fill="#000" font-size="13" textLength="211.32" font-family="monospace">ActualizarTextosDinamicos()</text><text x="586.952" y="605.129" fill="#000" font-size="13" textLength="84.665">para traducir</text><text x="371.5" y="620.262" fill="#000" font-size="13" textLength="184.596">los encabezados de la grilla.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="74"><path d="M705,573.297 L705,613.563 A0,0 0 0 0 705,613.563 L1007.214,613.563 A0,0 0 0 0 1007.214,613.563 L1007.214,583.297 L997.214,573.297 L860,573.297 L856,513.818 L852,573.297 L705,573.297 A0,0 0 0 0 705,573.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M997.214,573.297 L997.214,583.297 L1007.214,583.297 L997.214,573.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="711" y="590.364" fill="#000" font-size="13" textLength="211.32" font-family="monospace">ActualizarTextosDinamicos()</text><text x="926.452" y="590.364" fill="#000" font-size="13" textLength="65.762">recarga el</text><text x="711" y="605.497" fill="#000" font-size="13" textLength="268.423">árbol de roles con los prefijos traducidos.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="79"><path d="M1025.5,557.797 L1025.5,628.328 A0,0 0 0 0 1025.5,628.328 L1258.131,628.328 A0,0 0 0 0 1258.131,628.328 L1258.131,567.797 L1248.131,557.797 L1117.105,557.797 L1066.851,501.457 L1109.105,557.797 L1025.5,557.797 A0,0 0 0 0 1025.5,557.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1248.131,557.797 L1248.131,567.797 L1258.131,567.797 L1248.131,557.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1031.5" y="574.864" fill="#000" font-size="13" textLength="207.791">No redefine ningún hook: usa la</text><text x="1031.5" y="589.997" fill="#000" font-size="13" textLength="192.34">secuencia tal cual. Así son 26</text><text x="1031.5" y="605.129" fill="#000" font-size="13" textLength="211.631">formularios en total (todos salvo</text><text x="1031.5" y="620.262" fill="#000" font-size="1