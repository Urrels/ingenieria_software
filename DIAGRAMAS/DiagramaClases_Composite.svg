<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="594px" preserveAspectRatio="none" style="width:2055px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 2055 594" width="2055px" zoomAndPan="magnify"><title>Patr&#243;n Composite &#8212; &#193;rbol de Roles y Permisos (BE)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="408.5293" x="819.4854" y="22.9951">Patr&#243;n Composite &#8212; &#193;rbol de Roles y Permisos (BE)</text></g><!--cluster BE--><g class="cluster" data-qualified-name="BE" data-source-line="9" id="ent0002"><rect fill="#FEFECE" height="462" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="602" x="328" y="126.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="20.2344" x="618.8828" y="141.292">BE</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="51" id="ent0010"><path d="M6,179.7969 L6,280.5938 A0,0 0 0 0 6,280.5938 L261.2678,280.5938 L613.5364,424.1544 L269.2678,280.5938 L318.1162,280.5938 A0,0 0 0 0 318.1162,280.5938 L318.1162,189.7969 L308.1162,179.7969 L6,179.7969 A0,0 0 0 0 6,179.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M308.1162,179.7969 L308.1162,189.7969 L318.1162,189.7969 L308.1162,179.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.7954" x="12" y="196.8638">Component</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.4297" x="99.9277" y="196.8638">(abstracto): define la interfaz</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.0864" x="12" y="211.9966">com&#250;n para hojas y ramas, de modo que el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.6436" x="12" y="227.1294">cliente trate a ambas de manera uniforme</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="12" y="242.2622">(</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="17.0718" y="242.2622">Agregar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="71.8584" y="242.2622">,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="46.96" x="80.123" y="242.2622">Quitar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="127.083" y="242.2622">,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="135.3477" y="242.2622">ObtenerHijos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="229.2676" y="242.2622">,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="46.96" x="237.5322" y="242.2622">EsHoja</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="284.4922" y="242.2622">).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.5996" x="12" y="257.395">Se persiste en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="108.7319" y="257.395">NODO_PERMISO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.8931" x="206.7842" y="257.395">(columna</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="271.8096" y="257.395">TIPO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.0742" x="12" y="272.5278">distingue</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="62.6133" x="76.2065" y="272.5278">'PERFIL'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.25" x="142.9521" y="272.5278">de</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="70.4399" x="163.3345" y="272.5278">'PERMISO'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="233.7744" y="272.5278">).</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="60" id="ent0013"><path d="M1378.5,157.2969 L1378.5,303.4922 A0,0 0 0 0 1378.5,303.4922 L1703.959,303.4922 A0,0 0 0 0 1703.959,303.4922 L1703.959,167.2969 L1693.959,157.2969 L1463.3742,157.2969 L856.1964,153.238 L1455.3742,157.2969 L1378.5,157.2969 A0,0 0 0 0 1378.5,157.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1693.959,157.2969 L1693.959,167.2969 L1703.959,167.2969 L1693.959,157.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.4795" x="1384.5" y="174.3638">Composite</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.2188" x="1466.1118" y="174.3638">(rama): representa un</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="19.7983" x="1614.4629" y="174.3638">rol</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="1384.5" y="189.4966">(</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="1389.5718" y="189.4966">TIPO='PERFIL'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1763" x="1491.3184" y="189.4966">). Mantiene una lista de hijos</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="46.96" x="1384.5" y="204.6294">_hijos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.2349" x="1435.5923" y="204.6294">&#8212; que pueden ser otros</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="23.48" x="1595.9595" y="204.6294">Rol</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.4067" x="1623.5718" y="204.6294">(jerarqu&#237;a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.4673" x="1384.5" y="219.7622">de roles v&#237;a</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1464.0996" y="219.7622">PadreId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="29.231" x="1518.8862" y="219.7622">) y/o</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1552.2495" y="219.7622">Permiso</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.4414" x="1611.1685" y="219.7622">(permisos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.2002" x="1384.5" y="234.895">asignados al rol). Implementa</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1582.8325" y="234.895">Agregar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="1637.6191" y="234.895">/</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="46.96" x="1641.999" y="234.895">Quitar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.6074" x="1384.5" y="250.0278">operando sobre esa lista.</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="1384.5" y="265.1606">Protegido=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.3154" x="1498.2056" y="265.1606">marca al rol "Administrador":</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.4414" x="1384.5" y="280.2935">no puede eliminarse ni quedar sin permisos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.9272" x="1384.5" y="295.4263">cr&#237;ticos (ver</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="1465.5596" y="295.4263">PerfilBLL.Eliminar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="1606.4395" y="295.4263">).</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="72" id="ent0016"><path d="M1721.5,172.2969 L1721.5,288.2266 A0,0 0 0 0 1721.5,288.2266 L2048.8188,288.2266 A0,0 0 0 0 2048.8188,288.2266 L2048.8188,182.2969 L2038.8188,172.2969 L1826.3589,172.2969 L530.791,173.5989 L1818.3589,172.2969 L1721.5,172.2969 A0,0 0 0 0 1721.5,172.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2038.8188,172.2969 L2038.8188,182.2969 L2048.8188,182.2969 L2038.8188,172.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.5288" x="1727.5" y="189.3638">Leaf</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0488" x="1763.1611" y="189.3638">(hoja): representa un</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.2046" x="1905.3423" y="189.3638">permiso</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.1465" x="1727.5" y="204.4966">del cat&#225;logo (</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="1816.6465" y="204.4966">TIPO='PERMISO'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.4146" x="1926.2197" y="204.4966">, sin hijos).</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1727.5" y="219.6294">Agregar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="1782.2866" y="219.6294">/</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="46.96" x="1786.6665" y="219.6294">Quitar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.8467" x="1837.7588" y="219.6294">lanzan</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="1727.5" y="234.7622">InvalidOperationException</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.52" x="1927.2988" y="234.7622">porque una hoja</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.6504" x="1727.5" y="249.895">no puede contener nodos.</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="1902.2827" y="249.895">ObtenerHijos()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.3701" x="1727.5" y="265.0278">devuelve siempre una lista vac&#237;a y</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="62.6133" x="1727.5" y="280.1606">EsHoja()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.4839" x="1794.2456" y="280.1606">devuelve</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="1857.8618" y="280.1606">true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1889.1685" y="280.1606">.</text></g><!--class PerfilBLL--><g class="entity" data-qualified-name="PerfilBLL" data-source-line="85" id="ent0018"><rect fill="#F1F1F1" height="40.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="92.7236" x="940.5" y="210.2969"/><ellipse cx="955.5" cy="230.4297" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M958.4688,236.0703 Q957.8906,236.3672 957.25,236.5078 Q956.6094,236.6641 955.9063,236.6641 Q953.4063,236.6641 952.0781,235.0234 Q950.7656,233.3672 950.7656,230.2422 Q950.7656,227.1172 952.0781,225.4609 Q953.4063,223.8047 955.9063,223.8047 Q956.6094,223.8047 957.25,223.9609 Q957.9063,224.1172 958.4688,224.4141 L958.4688,227.1328 Q957.8438,226.5547 957.25,226.2891 Q956.6563,226.0078 956.0313,226.0078 Q954.6875,226.0078 954,227.0859 Q953.3125,228.1484 953.3125,230.2422 Q953.3125,232.3359 954,233.4141 Q954.6875,234.4766 956.0313,234.4766 Q956.6563,234.4766 957.25,234.2109 Q957.8438,233.9297 958.4688,233.3516 L958.4688,236.0703 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="36.2871" x="981.7183" y="226.4355">&#171;BLL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.7236" x="969.5" y="242.2607">PerfilBLL</text></g><!--class frmPerfiles--><g class="entity" data-qualified-name="frmPerfiles" data-source-line="86" id="ent0019"><rect fill="#F1F1F1" height="40.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.749" x="1068" y="41.2969"/><ellipse cx="1083" cy="61.4297" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1085.9688,67.0703 Q1085.3906,67.3672 1084.75,67.5078 Q1084.1094,67.6641 1083.4063,67.6641 Q1080.9063,67.6641 1079.5781,66.0234 Q1078.2656,64.3672 1078.2656,61.2422 Q1078.2656,58.1172 1079.5781,56.4609 Q1080.9063,54.8047 1083.4063,54.8047 Q1084.1094,54.8047 1084.75,54.9609 Q1085.4063,55.1172 1085.9688,55.4141 L1085.9688,58.1328 Q1085.3438,57.5547 1084.75,57.2891 Q1084.1563,57.0078 1083.5313,57.0078 Q1082.1875,57.0078 1081.5,58.0859 Q1080.8125,59.1484 1080.8125,61.2422 Q1080.8125,63.3359 1081.5,64.4141 Q1082.1875,65.4766 1083.5313,65.4766 Q1084.1563,65.4766 1084.75,65.2109 Q1085.3438,64.9297 1085.9688,64.3516 L1085.9688,67.0703 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.5508" x="1112.0991" y="57.4355">&#171;Form&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.749" x="1097" y="73.2607">frmPerfiles</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="92" id="ent0023"><path d="M938.5,420.7969 L938.5,536.7266 A0,0 0 0 0 938.5,536.7266 L1247.2329,536.7266 A0,0 0 0 0 1247.2329,536.7266 L1247.2329,430.7969 L1237.2329,420.7969 L1072.4609,420.7969 L995.3176,250.6393 L1064.4609,420.7969 L938.5,420.7969 A0,0 0 0 0 938.5,420.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1237.2329,420.7969 L1237.2329,430.7969 L1247.2329,430.7969 L1237.2329,420.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="944.5" y="437.8638">ObtenerArbol()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.0273" x="1058.2056" y="437.8638">arma el &#225;rbol en memoria:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.3896" x="944.5" y="452.9966">primero crea todos los</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="23.48" x="1095.022" y="452.9966">Rol</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.6113" x="1122.6343" y="452.9966">(filas</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="944.5" y="468.1294">TIPO='PERFIL'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.7886" x="1046.2466" y="468.1294">) y los enlaza por</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1162.1675" y="468.1294">PadreId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="1216.9541" y="468.1294">;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.5942" x="944.5" y="483.2622">luego, para cada fila de</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="86.0933" x="1102.2266" y="483.2622">ROL_PERMISO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.7212" x="1188.3198" y="483.2622">, crea</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.4785" x="944.5" y="498.395">un</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="965.1108" y="498.395">Permiso</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.5068" x="1024.0298" y="498.395">y lo agrega (</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="70.4399" x="1106.5366" y="498.395">Agregar()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.7822" x="1176.9766" y="498.395">) al</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="23.48" x="944.5" y="513.5278">Rol</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1416" x="972.1123" y="513.5278">correspondiente. El resultado es una</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.416" x="944.5" y="528.6606">lista de ra&#237;ces</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="133.0532" x="1039.0483" y="528.6606">List&lt;NodoPermiso&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1172.1016" y="528.6606">.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="102" id="ent0026"><path d="M1051.5,187.2969 L1051.5,272.9609 A0,0 0 0 0 1051.5,272.9609 L1360.6836,272.9609 A0,0 0 0 0 1360.6836,272.9609 L1360.6836,197.2969 L1350.6836,187.2969 L1191.131,187.2969 L1133.7562,81.3101 L1183.131,187.2969 L1051.5,187.2969 A0,0 0 0 0 1051.5,187.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1350.6836,187.2969 L1350.6836,197.2969 L1360.6836,197.2969 L1350.6836,187.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.8257" x="1057.5" y="204.3638">Recorre el &#225;rbol recursivamente sin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.7505" x="1057.5" y="219.4966">distinguir el tipo concreto: solo usa</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="1057.5" y="234.6294">NodoPermiso.ObtenerHijos()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.6934" x="1265.1255" y="234.6294">y</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="62.6133" x="1276.9512" y="234.6294">EsHoja()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.0005" x="1057.5" y="249.7622">para decidir c&#243;mo mostrar cada nodo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.1836" x="1057.5" y="264.895">(TreeView con prefijos "[Rol]" / "[Permiso]").</text></g><!--class NodoPermiso--><g class="entity" data-qualified-name="BE.NodoPermiso" data-source-line="11" id="ent0003"><rect fill="#F1F1F1" height="202.9375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="284.4395" x="614" y="377.2969"/><ellipse cx="705.6255" cy="397.4297" fill="#A9DCDF" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M705.7349,392.7734 L704.5786,397.8516 L706.9067,397.8516 L705.7349,392.7734 Z M704.2505,390.5391 L707.2349,390.5391 L710.5942,402.9297 L708.1411,402.9297 L707.3755,399.8672 L704.0942,399.8672 L703.3442,402.9297 L700.9067,402.9297 L704.2505,390.5391 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="84.3516" x="730.2939" y="393.4355">&#171;Component&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="92.6885" x="726.1255" y="409.2607">NodoPermiso</text><line style="stroke:#181818;stroke-width:0.5;"